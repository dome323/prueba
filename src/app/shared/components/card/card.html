<div class="border p-4 rounded shadow">

  <img
    [src]="item().flags.png"
    [alt]="item().flags.alt"
    class="w-full h-48 object-cover">

  <h2 class="text-2xl mt-4">

    {{ item().name.common }}

  </h2>

  <p>

    {{ item().capital?.[0] }}

  </p>

  <a
    [routerLink]="['/details', item().name.common]"
    class="text-blue-500">

    Ver detalle

  </a>

</div>
